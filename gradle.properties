org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Reuse the task graph between builds. In CI, setup-gradle restores it across runs when the
# GRADLE_ENCRYPTION_KEY secret is set (see .github/workflows/ci.yml).
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# YAMNet (Apache-2.0), the stage-1 bell classifier (F14). Downloaded at build time, never committed.
# scripts/bell/replay-yamnet.sh reads the same two lines.
belllap.yamnet.url=https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite
belllap.yamnet.sha256=4d8b4a53282dc83ef04e3e7dbc4fbc98082e34e44ed798e16c3a0cdd4c584faf
# Bug reports (F22). Override either in ~/.gradle/gradle.properties or CI; when empty, Send is disabled.
# Bug reports (F22). Both stay empty in the repo; the Send button is disabled until a build sets them.
# Not secrets: the Worker URL (backend/README.md) and the Firebase Web API key, which only identifies the project. Restrict the key to the Android app and the Firebase App Check API in Google Cloud.
belllap.reportsUrl=https://belllap-bugreport.belllap.workers.dev
belllap.firebaseApiKey=AIzaSyALmADI8MEl7IxYsFMh3niwZWBOGlf_xpU
