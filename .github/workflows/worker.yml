name: Worker

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/worker.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: backend/worker

jobs:
  test:
    name: worker-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: worker-deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when Cloudflare is not set up
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set; skipped the Worker deploy (see backend/README.md)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@v7

      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json

      - if: steps.gate.outputs.deploy == 'true'
        run: npm ci

      - name: Deploy
        if: steps.gate.outputs.deploy == 'true'
        run: npx wrangler deploy
