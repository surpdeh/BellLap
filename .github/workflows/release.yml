name: Release

# F41: a tag `vX.Y.Z` builds a signed APK and AAB, publishes a GitHub Release, and (optionally) uploads to the Play internal track.
# Required secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
# Optional secret: PLAY_SERVICE_ACCOUNT_JSON (Play upload is skipped without it). See docs/RELEASING.md.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # creates the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BELLLAP_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      BELLLAP_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      BELLLAP_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode keystore
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BELLLAP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease bundleRelease \
            -Pbelllap.versionName="$version" \
            -Pbelllap.versionCode="$GITHUB_RUN_NUMBER"

      - name: Verify the APK is signed
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=$(ls app/build/outputs/apk/release/*.apk)
          "$apksigner" verify --verbose "$apk"
          mkdir dist
          cp "$apk" "dist/belllap-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/belllap-${GITHUB_REF_NAME}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease

      - name: Job summary
        run: |
          {
            echo "### Release $GITHUB_REF_NAME"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "Play internal upload: ${HAS_PLAY}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Play internal track
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.belllap
          releaseFiles: dist/belllap-${{ github.ref_name }}.aab
          track: internal
          status: completed
