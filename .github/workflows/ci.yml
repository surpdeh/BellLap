name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write # action-junit-report creates the "JUnit Test Report" check run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Lets setup-gradle save the configuration cache, which skips the 40-60 s cold configuration on a hit.
          # Without the secret it still runs, just without that cache.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Lint, unit tests, screenshots, assemble
        run: ./gradlew --continue lintDebug detekt testDebugUnitTest verifyRoborazziDebug assembleDebug

      - name: Detector metrics (synthetic fixtures)
        if: hashFiles('testing/harness/build.gradle.kts') != ''
        run: ./gradlew :testing:harness:replay

      - uses: actions/setup-python@v6
        if: hashFiles('scripts/bell/replay-yamnet.sh') != ''
        with:
          python-version: '3.12'

      - name: Bell metrics with YAMNet stage 1 (synthetic fixtures)
        if: hashFiles('scripts/bell/replay-yamnet.sh') != ''
        run: scripts/bell/replay-yamnet.sh

      - name: Test summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          detailed_summary: true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            **/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # Runs alongside build-test, not after it: it builds its own APKs and is the longer job, so waiting for
  # build-test only added that job's 3-5 minutes to every run.
  emulator-e2e:
    name: emulator-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Lets setup-gradle save the configuration cache, which skips the 40-60 s cold configuration on a hit.
          # Without the secret it still runs, just without that cache.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Host ffmpeg encodes race_synth for the replay tests (:app:raceSynthMedia, cached by Gradle) and turns the
      # screen recording into a GIF. CI only; it is not shipped in the app.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Compile the app and test APKs (and encode race_synth) in the background while the next step installs the
      # system image and boots the emulator; scripts/ci/emulator-e2e.sh waits for it before running the tests.
      - name: Build test APKs in the background
        run: |
          ( ./gradlew assembleDebug assembleDebugAndroidTest --console=plain; echo $? > prebuild.status ) > prebuild.log 2>&1 &

      - name: Instrumented tests with screen recording
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # google_atd is headless (no SystemUI), so every screenshot and recording came out black.
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: bash scripts/ci/emulator-e2e.sh

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-evidence
          path: |
            evidence/
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore

  evidence-comment:
    name: evidence-comment
    needs: [build-test, emulator-e2e]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish evidence and upsert PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_RESULT: ${{ needs.build-test.result }}
          E2E_RESULT: ${{ needs.emulator-e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci/publish-evidence.sh
