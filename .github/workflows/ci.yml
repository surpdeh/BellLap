name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write # action-junit-report creates the "JUnit Test Report" check run
    outputs:
      has_gradle: ${{ steps.detect.outputs.has_gradle }}
    steps:
      - uses: actions/checkout@v7

      - id: detect
        run: |
          if [ -f gradlew ]; then echo "has_gradle=true" >> "$GITHUB_OUTPUT"; else
            echo "has_gradle=false" >> "$GITHUB_OUTPUT"
            echo "No Gradle project yet (F00 not merged); skipping Android jobs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.detect.outputs.has_gradle == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - if: steps.detect.outputs.has_gradle == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, unit tests, screenshots, assemble
        if: steps.detect.outputs.has_gradle == 'true'
        # Task lists live in scripts/ci/gradle-checks.txt so tier1.sh and precheck.sh run the same checks.
        run: |
          . scripts/ci/lib.sh
          tasks=$(gradle_tasks checks)
          ./gradlew --continue $tasks

      - name: Detector metrics (synthetic fixtures)
        if: steps.detect.outputs.has_gradle == 'true' && hashFiles('testing/harness/build.gradle.kts') != ''
        run: |
          . scripts/ci/lib.sh
          tasks=$(gradle_tasks replay)
          ./gradlew $tasks

      - uses: actions/setup-python@v6
        if: steps.detect.outputs.has_gradle == 'true' && hashFiles('scripts/bell/replay-yamnet.sh') != ''
        with:
          python-version: '3.12'

      - name: Bell metrics with YAMNet stage 1 (synthetic fixtures)
        if: steps.detect.outputs.has_gradle == 'true' && hashFiles('scripts/bell/replay-yamnet.sh') != ''
        run: scripts/bell/replay-yamnet.sh

      - name: Test summary
        if: always() && steps.detect.outputs.has_gradle == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          detailed_summary: true

      - if: always() && steps.detect.outputs.has_gradle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tier1-reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            **/build/test-results/
          if-no-files-found: ignore

      - if: steps.detect.outputs.has_gradle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  emulator-e2e:
    name: emulator-e2e
    needs: build-test
    if: needs.build-test.outputs.has_gradle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      # Host ffmpeg encodes race_synth for the replay tests (:app:raceSynthMedia, cached by Gradle) and turns the
      # screen recording into a GIF. CI only; it is not shipped in the app.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests with screen recording
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # google_atd is headless (no SystemUI), so every screenshot and recording came out black.
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: bash scripts/ci/emulator-e2e.sh

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-evidence
          path: |
            evidence/
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore

  evidence-comment:
    name: evidence-comment
    needs: [build-test, emulator-e2e]
    if: always() && github.event_name == 'pull_request' && needs.build-test.outputs.has_gradle == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish evidence and upsert PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_RESULT: ${{ needs.build-test.result }}
          E2E_RESULT: ${{ needs.emulator-e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci/publish-evidence.sh
