name: Claude agent

# Async development agent. Trigger by commenting "@claude ..." on an issue or PR,
# or by adding the `agent:go` label to a feature issue.
# Requires repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY,
# and the Claude GitHub App installed on the repo (https://github.com/apps/claude).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent:go') ||
      (github.event_name != 'issues' && contains(github.event.comment.body || github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ github.event_name == 'issues' && format('Implement issue #{0} following CLAUDE.md. Run tier 1 verification (verify-belllap skill), then open a PR that closes the issue with the Verification section filled in.', github.event.issue.number) || '' }}
          claude_args: |
            --allowedTools "Bash(./gradlew:*),Bash(git:*),Bash(gh:*),Bash(ls:*),Bash(find:*),Read,Write,Edit,Glob,Grep"
